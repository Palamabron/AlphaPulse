[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alphapulse"
version = "0.5.0"
description = "Config-driven framework for building, training, and deploying Numerai competition pipelines."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = []
authors = [
  { name = "jakub.szulc", email = "szulcak05@gmail.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "python-dotenv",
  "loguru>=0.7",
  "pydantic>=2,<3",
  "pandas>=2,<3",
  "numerapi",
  "tyro",
  "wandb",
  "cloudpickle",
  "xgboost>=2,<3",
  "lightgbm>=4,<5",
  "catboost>=1.2,<2",
  "optuna>=3,<5",
  "scipy>=1.12,<2",
  "scikit-learn>=1.4,<2",
  "pyarrow>=14,<20",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = [
  "pre-commit>=3.7.0",
  "ruff>=0.12",
  "black>=24",
  "mypy>=1.10",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "types-PyYAML>=6.0",
  "nbqa>=1.9.1",
  "vulture>=2.14",
]
hpo = [
  "ray[tune]>=2.0",
]
deep = [
  "pytorch_tabular",
  "torch",
]
foundation = [
  "tabpfn>=7.0",
  "tabicl>=2.0",
]
foundation-api = [
  "tabpfn-client>=0.3.0",
]
eda = [
  "streamlit>=1.30",
  "plotly>=5.18",
  "matplotlib>=3.8",
  "networkx>=3.2",
]


[project.urls]
Documentation = "https://github.com/Palamabron/AlphaPulse/blob/main/README.md"
Issues = "https://github.com/Palamabron/AlphaPulse/issues"
Source = "https://github.com/Palamabron/AlphaPulse"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["alphapulse*"]

[tool.coverage.run]
source_pkgs = ["alphapulse"]
branch = true
parallel = true
omit = [
  "src/alphapulse/__about__.py",
  "eda/*",
]

[tool.coverage.paths]
alphapulse = ["src/alphapulse", "*/alphapulse/src/alphapulse"]
tests = ["tests", "*/alphapulse/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["build", "dist", ".venv", ".eggs", "eda"]
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",
  "I",
  "UP",
  "B",
  "ASYNC",
  "S",
  "C4",
  "PIE",
  "T20",
  "PLE",
  "PLW",
]
ignore = [
  "S101",
  "S301",
  "S311",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108", "T20", "E501"]
"scripts/**" = ["T20", "S607"]
"src/alphapulse/logging_/cli.py" = ["PLW0603"]
"src/alphapulse/logging_/wandb_logging.py" = ["PLW0603"]
"src/alphapulse/autoresearch/agent.py" = ["E501", "S603", "S607"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
show_error_codes = true
pretty = true
exclude = [
  '^build/.*',
  '^dist/.*',
  '^\.venv/.*',
  '^eda/.*',
  '^tests/test_eda\.py$',
]

[[tool.mypy.overrides]]
module = [
  "cloudpickle",
  "ray",
  "ray.*",
  "pandas",
  "pandas.*",
  "pyarrow",
  "pyarrow.*",
  "requests.*",
  "sklearn",
  "sklearn.*",
  "yaml.*",
  "lightgbm",
  "lightgbm.*",
  "catboost",
  "catboost.*",
  "optuna",
  "optuna.*",
  "scipy",
  "scipy.*",
  "xgboost",
  "xgboost.*",
  "sdv",
  "sdv.*",
  "pytorch_tabular",
  "pytorch_tabular.*",
  "torch",
  "torch.*",
  "tabpfn",
  "tabpfn.*",
  "tabpfn_client",
  "tabpfn_client.*",
  "tabicl",
  "tabicl.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["scripts.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
