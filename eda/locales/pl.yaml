# Navigation
navigation:
  header: "Nawigacja"
  description: |
    Użyj **menu bocznego** aby przejść do różnych stron analizy:

    1. **Analiza targetu** — rozkład i stabilność zmiennej docelowej
    2. **Analiza cech** — indywidualna eksploracja cech i zachowanie w erach
    3. **Korelacje** — korelacje cech z targetem i między cechami
    4. **Analiza er** — wzorce temporalne i stabilność cech w czasie
    5. **Rozkłady cech** — statystyki rozkładów i testy jednostajności
    6. **Ważność cech** — rankingi ważności Pearson i LightGBM
    7. **Clustering** — klasteryzacja hierarchiczna do identyfikacji redundantnych cech
    8. **Analiza HPO** — wizualizacja wyników optymalizacji hiperparametrów

