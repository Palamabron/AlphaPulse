# Navigation
navigation:
  header: "Navigation"
  description: |
    Use the **sidebar** to navigate to different analysis pages:

    1. **Target Analysis** — distribution and stability of the target variable
    2. **Feature Analysis** — individual feature exploration and era behaviour
    3. **Correlations** — feature-to-target and inter-feature correlation analysis
    4. **Era Analysis** — temporal patterns and feature stability over eras
    5. **Feature Distributions** — value distribution statistics and uniformity tests
    6. **Feature Importance** — Pearson and LightGBM importance rankings
    7. **Clustering** — hierarchical clustering to identify redundant feature groups
    8. **HPO Analysis** — visualise results from a hyperparameter optimisation run

