version: "1"
data:
  data_dir: data/v5.2
  train_subsample: 0.125
  target_col: target
  seed: 42
features:
  columns: null
  groups: {}
preprocessing:
  - type: RobustScaler
    params: {}
models:
  - type: CatBoost
    params:
      params:
        depth: 6
        learning_rate: 0.03
        l2_leaf_reg: 5.0
        min_data_in_leaf: 200
        colsample_bylevel: 0.3
        loss_function: RMSE
        verbose: 0
      iterations: 400
      early_stopping_rounds: 50
ensemble_method: single
neutralization:
  proportion: 0.35
meta_neutralization:
  proportion: 0.0
train:
  n_rounds: 400
  early_stopping_rounds: 50
evaluation:
  primary_metric: payout_score
  walk_forward: false
